name: Offline checks

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.13'
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the pinned collector dependency
        run: python -m pip install --disable-pip-version-check -r requirements.txt
      - name: Test the portable collector without network access
        run: python -m unittest discover -s tests -p 'test_*.py'
      - name: Test publication and last-good snapshot storage
        run: python -m unittest discover -s scripts -p 'test_*.py'
      - name: Test the ranking interface
        run: node --test tests/site.test.mjs
      - name: Validate and build the seeded public site
        run: python scripts/build_site.py
